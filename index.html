<div class="container">
  <h1>Focus Tree Timer</h1>
  
  <div class="tree-box">
    <div id="tree">🌱</div>
  </div>

  <div class="timer-display" id="timerDisplay">25:00</div>

  <div class="input-group">
    <label for="customMinutes">විනාඩි ගණන:</label>
    <input type="number" id="customMinutes" value="25" min="1" max="180">
    <button id="setCustomBtn">Set</button>
  </div>

  <div class="presets">
    <button class="preset-btn" data-time="5">5m</button>
    <button class="preset-btn" data-time="15">15m</button>
    <button class="preset-btn active" data-time="25">25m</button>
    <button class="preset-btn" data-time="45">45m</button>
    <button class="preset-btn" data-time="60">60m</button>
  </div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="stats">
    🌲 Forest: <span id="treeCount">0</span> Trees Planted
  </div>
</div>
